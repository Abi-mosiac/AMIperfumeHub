<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#403127"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/assets/icons/icon-192.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/assets/icons/icon-192.svg"><title>Vendor dashboard — AMIPerfumeHub</title><link rel="stylesheet" href="/static/assets/css/style.css"><script defer src="/static/js/app.js?v=admin-login-fix-3"></script></head><body data-page="vendor"><div id="site-header"></div><main class="section container"><span class="eyebrow">Vendor workspace</span><h1>Welcome, <span id="vendor-welcome"></span></h1><div class="notice" data-notice hidden></div><div id="vendor-stats" class="stat-grid"></div><section class="section"><span class="eyebrow">Your business</span><h2>Vendor profile</h2><form id="vendor-profile-form" class="panel form-grid"><label>Business name<input name="business_name" minlength="2" maxlength="150" required></label><label>Description<textarea name="business_description" maxlength="2000"></textarea></label><label>Contact phone<input name="contact_phone" maxlength="30"></label><button>Save business profile</button></form></section><section class="section"><div class="section-heading"><div><span class="eyebrow">Your catalogue</span><h2>Products</h2></div></div><form id="new-product-form" class="panel form-grid"><h3>Add a fragrance</h3><div class="filters"><label>Name<input name="name" minlength="2" maxlength="150" required></label><label>Category<input name="category" minlength="2" maxlength="100" required></label><label>Price (₦)<input type="number" name="price" min="0.01" step="0.01" required></label><label>Stock<input type="number" name="stock" min="0" value="0" required></label></div><div class="image-upload"><label>Image URL<input type="text" name="image_url" maxlength="500"></label><label>Or upload an image<input type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="secondary" type="button" data-upload-image>Upload image</button></div><label>Description<textarea name="description"></textarea></label><button>Add product</button></form><div id="vendor-products" class="space-top">Loading your products…</div></section><section class="section"><span class="eyebrow">Fulfilment</span><h2>Orders for your products</h2><div id="vendor-orders">Loading orders…</div></section></main><div id="site-footer"></div></body></html>
